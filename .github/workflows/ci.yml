name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      # Renovate keeps the SHA and the version comment up to date.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Version is read from "packageManager" in package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (format / lint / type check)
        run: pnpm exec vp check

      - name: Lint (no warnings allowed)
        run: pnpm lint

      - name: Test
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      # Exercise the git hooks installed by lefthook (pre-commit + commitlint)
      - name: Git hooks (lefthook / commitlint)
        run: |
          git config user.name "ci"
          git config user.email "ci@example.com"
          pnpm exec lefthook install
          git commit --allow-empty -m "chore: verify git hooks in ci"
          if git commit --allow-empty -m "this message should be rejected"; then
            echo "::error::commitlint did not reject an invalid commit message"
            exit 1
          fi
